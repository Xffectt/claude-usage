<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude usage</title>
<link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Claude usage"><meta name="theme-color" content="#0d0d0d">
<style>body{margin:0;background:#0d0d0d;color:#c3c2b7;font:15px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px;box-sizing:border-box;text-align:center}</style>
</head><body><p id="m">Loading…</p>
<script>
(async () => {
  const m = document.getElementById('m');
  let g = new URLSearchParams(location.search).get('g');
  try { if (g) localStorage.setItem('gistId', g); else g = localStorage.getItem('gistId'); } catch (e) {}
  if (!g) { m.textContent = 'Open this page with ?g=YOUR_GIST_ID (sync.js prints the full link).'; return; }
  try {
    const r = await fetch('https://api.github.com/gists/' + encodeURIComponent(g), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status === 403 ? 'GitHub rate limit hit, try again in a few minutes.' : 'Could not load your data (' + r.status + ').');
    const f = (await r.json()).files['dashboard.html'];
    if (!f) throw new Error('No dashboard yet. Run sync.js on your PC.');
    const html = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
    document.open(); document.write(html); document.close();
  } catch (e) { m.textContent = e.message; }
})();
</script>
</body></html>
